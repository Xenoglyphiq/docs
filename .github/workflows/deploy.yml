name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE-*']  # docs-only changes don't need CI
  pull_request:
    paths-ignore: ['**.md', 'LICENSE-*']  # docs-only changes don't need CI
  # Rebuild daily so library data (ports, releases, registry listings) stays current.
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        uses: withastro/action@v6
        with:
          node-version: 22
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
