# The only hand-edited library data. Everything else (summary, ports' status and
# conformance, examples, benchmarks, registry listings) is read at build time from
# the spec and port repos, so the site can't drift from them.
#
# Order here doesn't matter: the site lists libraries by name and ports in the org's language
# order (Swift, Go, Python, Kotlin, Rust, Nim, Zig, Julia).
#
# ref: the git ref the site reads a port at. Use the release tag once there is one;
# `main` before that (the install command then says the release is pending).

libraries:
  - id: polyline
    name: Polyline
    spec: Xenoglyphiq/polyline-spec
    note: >-
      Points are `(lon, lat)`, as in GeoJSON. The encoded string stores latitude
      first; every port converts at the boundary.
    ports:
      - language: zig
        repo: Xenoglyphiq/polyline-zig
        ref: v0.1.0
      - language: julia
        repo: Xenoglyphiq/EncodedPolyline.jl
        ref: main
      - language: nim
        repo: Xenoglyphiq/polyline-nim
        ref: v0.1.0
  - id: pmtiles
    name: PMTiles
    spec: Xenoglyphiq/pmtiles-spec
    note: >-
      Read-only. Tiles come back exactly as stored, still compressed with the
      archive's tile compression; decoding vector tiles (MVT) or images is up to you.
    ports:
      - language: nim
        repo: Xenoglyphiq/pmtiles-nim
        ref: v0.2.0
      - language: swift
        repo: Xenoglyphiq/pmtiles-swift
        ref: 0.2.0
        modules: [PMTiles, PMTilesIO]
        examples: Examples/{id}/main.swift
      - language: zig
        repo: Xenoglyphiq/pmtiles-zig
        ref: v0.2.0
        modules: [pmtiles, pmtiles_io]
  - id: robotstxt
    name: robots.txt
    spec: Xenoglyphiq/robotstxt-spec
    note: >-
      RFC 9309, with Google's parser as the tie-breaker where the RFC is loose. Pass
      the crawler's product token (FooBot, not a full User-Agent string) and the URL's
      path with its query. Crawl-delay is supported as an extension; it isn't part of RFC 9309.
    ports:
      - language: julia
        repo: Xenoglyphiq/RobotsTxt.jl
        ref: main
      - language: swift
        repo: Xenoglyphiq/robotstxt-swift
        ref: 0.1.0
        modules: [RobotsTxt, RobotsTxtIO]
        examples: Examples/{id}/main.swift
      - language: zig
        repo: Xenoglyphiq/robotstxt-zig
        ref: v0.1.0
        modules: [robotstxt, robotstxt_io]
